syntax = "proto3";

package user.v1;

option go_package = "KratosNew/api/user/v1;v1";

message User {
  uint64 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string address = 5;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string address = 4;
}

message CreateUserReply {
  User user = 1;
}

message GetUsersRequest {}

message GetUsersReply {
  repeated User users = 1;
}

message GetUserRequest {
  uint64 id = 1;
}

message GetUserReply {
  User user = 1;
}

message UpdateUserRequest {
  uint64 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string address = 5;
}

message UpdateUserReply {
  User user = 1;
}

message DeleteUserRequest {
  uint64 id = 1;
}

message DeleteUserReply {}